name: Tistory Auto Publisher

on:
  schedule:
    # KST 기준 13:00, 19:00 (UTC cron)
    - cron: '0 4 * * *'   # 13:00 KST
    - cron: '0 10 * * *'  # 19:00 KST
  workflow_dispatch:      # 수동 실행 가능

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run publisher
        env:
          TZ: Asia/Seoul
          KAKAO_ID: ${{ secrets.KAKAO_ID }}
          KAKAO_PW: ${{ secrets.KAKAO_PW }}
          URL_T: ${{ secrets.URL_T }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_AUTH_KEY: ${{ secrets.S3_AUTH_KEY }}
          SERVER_URI: ${{ secrets.SERVER_URI }}
          PUBLISH_COUNT: "2"
          RESERVE_OFFSETS_MINUTES: "35,119"
        run: npm run batch

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-${{ github.run_id }}
          path: debug-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
